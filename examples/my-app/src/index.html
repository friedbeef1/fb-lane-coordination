<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB-Lane Icons - my-app demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="page__header">
      <h1 class="page__title">FB-Lane Icon Set</h1>
      <p class="page__subtitle">Four lanes, four marks &#8212; minimal line &amp; geometric style.</p>
    </header>

    <section class="icon-grid">
      <article class="icon-card" data-lane="product">
        <img class="icon-card__art" src="assets/icons/product.svg" alt="Product lane icon" width="48" height="48" />
        <p class="icon-card__label">Product</p>
        <p class="icon-card__role">Backlog and merges</p>
      </article>

      <article class="icon-card" data-lane="tech">
        <img class="icon-card__art" src="assets/icons/tech.svg" alt="Tech lane icon" width="48" height="48" />
        <p class="icon-card__label">Tech</p>
        <p class="icon-card__role">APIs and schemas</p>
      </article>

      <article class="icon-card" data-lane="design">
        <img class="icon-card__art" src="assets/icons/design.svg" alt="Design lane icon" width="48" height="48" />
        <p class="icon-card__label">Design</p>
        <p class="icon-card__role">CSS and layout</p>
      </article>

      <article class="icon-card" data-lane="business">
        <img class="icon-card__art" src="assets/icons/business.svg" alt="Business lane icon" width="48" height="48" />
        <p class="icon-card__label">Business</p>
        <p class="icon-card__role">Copy and docs</p>
      </article>
    </section>
  </main>
</body>
</html>
